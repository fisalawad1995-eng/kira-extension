<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Save — Board Tab</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: 'Inter', -apple-system, sans-serif;
      background: #1b1423;
      color: #fff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .qs-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .qs-favicon { width: 22px; height: 22px; border-radius: 4px; flex-shrink: 0; margin-top: 2px; }
    .qs-tab-title { font-size: 14px; font-weight: 600; line-height: 1.3; }
    .qs-tab-url { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 3px; word-break: break-all; }

    label { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.6); display: block; margin-bottom: 6px; }

    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #48345c;
      background: #110c16 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="%23ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>') no-repeat right 12px center;
      background-size: 16px;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    select:focus { border-color: #8B5CF6; box-shadow: 0 0 0 2px rgba(139,92,246,0.2); }

    .dupe-warning {
      background: rgba(255,193,7,0.1);
      border: 1px solid rgba(255,193,7,0.3);
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 12px;
      color: #ffc107;
      display: none;
    }
    .dupe-warning.show { display: block; }

    .actions { display: flex; gap: 10px; }

    .btn-save {
      flex: 1;
      background: #7c4d8b;
      border: none;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-save:hover { background: #8b5aa0; }

    .btn-cancel {
      background: transparent;
      border: 1px solid rgba(255,107,107,0.3);
      color: #ff6b6b;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-cancel:hover { background: rgba(255,107,107,0.1); }

    .btn-stash-all {
      width: 100%;
      background: rgba(139, 92, 246, 0.14);
      border: 1px dashed rgba(139, 92, 246, 0.45);
      color: #c4b5fd;
      padding: 9px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-stash-all:hover {
      background: rgba(139, 92, 246, 0.25);
      border-color: #8B5CF6;
      color: #fff;
    }

    .saved-msg {
      text-align: center;
      padding: 20px;
      font-size: 15px;
      color: rgba(255,255,255,0.8);
      display: none;
    }
    .saved-msg span { font-size: 28px; display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="qs-header">
    <img class="qs-favicon" id="favicon" src="" alt="">
    <div>
      <div class="qs-tab-title" id="tab-title">Loading…</div>
      <div class="qs-tab-url" id="tab-url"></div>
    </div>
  </div>

  <div>
    <label>Save to Board</label>
    <select id="board-select"></select>
  </div>

  <div>
    <label>Page</label>
    <select id="page-select"></select>
  </div>

  <div class="dupe-warning" id="dupe-warning">⚠ Already saved in this page — save anyway?</div>

  <div class="actions">
    <button class="btn-save" id="btn-save">Save</button>
    <button class="btn-cancel" id="btn-cancel">Cancel</button>
  </div>

  <button class="btn-stash-all" id="btn-stash-all-popup">⚡ Stash All Open Tabs into New Board</button>

  <div class="saved-msg" id="saved-msg">
    <span>✓</span>Saved!
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
